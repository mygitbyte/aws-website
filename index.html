<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jishu's Shop</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1 class="brand">Jishu's Shop</h1>
      <p class="tag">Handpicked goods — delivered with care</p>
      <nav class="nav">
        <a href="#products">Shop</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="products" class="products">
      <h2>Featured Products</h2>
      <div id="product-grid" class="grid"></div>
    </section>

    <section id="about" class="about">
      <h2>About the Shop</h2>
      <p>Welcome to Jishu's Shop — small-batch, quality-first goods selected with care. Browse, pick your favorites, and enjoy fast shipping.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© <span id="year"></span> Jishu's Shop — All rights reserved.</div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
